[metadata]
name = formetr
version = 0.1.0
description = Rule-based Telegram fitness planner

[options]
packages = find:
python_requires = >=3.12
install_requires =
    aiogram>=3.13,<4
    SQLAlchemy[asyncio]>=2.0,<3
    aiosqlite>=0.20,<1
    alembic>=1.13,<2
    pydantic-settings>=2.5,<3

[options.extras_require]
dev =
    pytest>=8.3,<9
    pytest-asyncio>=0.24,<1

[options.packages.find]
include = app*
